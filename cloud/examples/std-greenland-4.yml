run_id: std-greenland-4

compute:
  backend: aws-batch
  instance: c7i.4xlarge
  # use_spot: false

inputs:
  base: std-greenland

pism:
  executable: pism
  args: >
    -i {{INPUTS.base}}/pism_Greenland_5km_v1.1.nc
    -bootstrap
    -grid.registration corner
    -dx 20km
    -dy 20km
    -Mz 101
    -Mbz 11
    -z_spacing equal
    -Lz 4000
    -Lbz 2000
    -skip
    -skip_max 10
    -grid.recompute_longitude_and_latitude false
    -ys -25000
    -ye 0
    -regrid_file {{INPUTS.base}}/g20km_10ka_hy.nc
    -regrid_vars litho_temp,thk,enthalpy,tillwat,basal_melt_rate_grounded
    -bed_def lc
    -atmosphere searise_greenland,delta_T,precip_scaling
    -surface pdd
    -atmosphere_precip_scaling_file {{INPUTS.base}}/pism_dT.nc
    -atmosphere_delta_T_file {{INPUTS.base}}/pism_dT.nc
    -sea_level constant,delta_sl
    -ocean_delta_sl_file {{INPUTS.base}}/pism_dSL.nc
    -front_retreat_file {{INPUTS.base}}/pism_Greenland_5km_v1.1.nc
    -sia_e 3.0
    -stress_balance ssa+sia
    -topg_to_phi
    -phi_min 15.0
    -phi_max 40.0
    -topg_min -300.0
    -topg_max 700.0
    -pseudo_plastic
    -pseudo_plastic_q 0.5
    -till_effective_fraction_overburden 0.02
    -tauc_slippery_grounding_lines
    -ts_file {{OUTPUT_DIR}}/ts_g20km_25ka_paleo.nc
    -ts_times -25000:yearly:0
    -extra_file {{OUTPUT_DIR}}/ex_g20km_25ka_paleo.nc
    -extra_times -25000:100:0
    -extra_vars diffusivity,temppabase,tempicethk_basal,bmelt,tillwat,velsurf_mag,mask,thk,topg,usurf,hardav,velbase_mag,tauc
    -o {{OUTPUT_DIR}}/g20km_25ka_paleo.nc
