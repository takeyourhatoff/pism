run_id: haseloff-smoke-001

compute:
  backend: aws-batch
  instance: c7i.4xlarge
  # use_spot: false

inputs:
  base: haseloff

pism:
  executable: pism
  args: >
    -i {{INPUTS.base}}/startSMALLablate.nc
    -bootstrap
    -Lz 3500
    -Mx 51
    -My 51
    -Mz 61
    -y 1
    -no_temp
    -o {{OUTPUT_DIR}}/out-{{RUN_ID}}.nc
