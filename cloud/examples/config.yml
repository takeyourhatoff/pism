run_id: biis-test-001
ensemble_members: 50

compute:
  backend: aws-batch
  instance: g5.xlarge
  gpus: 1
  mpi_ranks: 1
  # use_spot: false
  # instance_types: [c7i.4xlarge, hpc6a.48xlarge]

io:
  input_prefix: biis
  output_prefix: biis-test-001

pism:
  args: "--config {{INPUT_DIR}}/biis.cfg --time.end 20000 --o {{OUTPUT_DIR}}/member-{{MEMBER_ID}}.nc"
