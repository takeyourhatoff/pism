run_id: biis-test-001
ensemble_members: 50

compute:
  backend: aws-batch
  instance: g5.xlarge
  gpus: 1
  mpi_ranks: 1
  # use_spot: false
  # instance_types: [c7i.4xlarge, hpc6a.48xlarge]

cost:
  max_usd: 100
  estimated_hours_per_member: 0.4
  # estimated_usd_per_hour: 0.85

io:
  input_s3: "s3://<input-bucket>/biis"
  output_s3: "s3://<output-bucket>/biis-test-001"

pism:
  args: "--config {{INPUT_DIR}}/biis.cfg --time.end 20000 --o {{OUTPUT_DIR}}/member-{{MEMBER_ID}}.nc"
