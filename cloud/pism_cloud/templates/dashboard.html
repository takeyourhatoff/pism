<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PISM Cloud Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --accent: #0057d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 12px;
      padding: 12px 16px 24px;
    }

    .panel {
      border: 1px solid var(--border);
      padding: 12px;
    }

    .muted {
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      padding: 12px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 6px 4px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 10px;
      color: var(--muted);
    }

    .jobs-table tr {
      cursor: pointer;
    }

    .jobs-table tr.active {
      background: #f0f6ff;
    }

    .section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .section h3 {
      margin: 0 0 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    pre {
      margin: 0;
      padding: 8px;
      border: 1px solid var(--border);
      background: #fafafa;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow: auto;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>PISM Cloud Dashboard</h1>
    <div class="muted" id="refresh-status">Refreshing...</div>
  </header>

  <div class="layout">
    <section class="panel" id="jobs-panel">
      <table class="jobs-table" id="jobs"></table>
    </section>

    <section class="panel" id="detail-panel">
      <div>
        <h2 id="job-title">Select a job</h2>
        <div class="muted" id="job-subtitle">Choose a job to see details.</div>
      </div>

      <div class="section">
        <h3>Status</h3>
        <div id="status"></div>
      </div>

      <div class="section">
        <h3>Cost</h3>
        <div id="cost"></div>
      </div>

      <div class="section">
        <h3>Data</h3>
        <div id="data"></div>
      </div>

      <div class="section">
        <h3>History</h3>
        <div id="history"></div>
      </div>

      <div class="section">
        <h3>Args</h3>
        <pre id="args"></pre>
      </div>
    </section>
  </div>

  <script>
    const jobsEl = document.getElementById("jobs");
    const jobTitle = document.getElementById("job-title");
    const jobSubtitle = document.getElementById("job-subtitle");
    const statusEl = document.getElementById("status");
    const costEl = document.getElementById("cost");
    const dataEl = document.getElementById("data");
    const historyEl = document.getElementById("history");
    const argsEl = document.getElementById("args");
    const refreshStatus = document.getElementById("refresh-status");

    let selectedJob = null;

    function getJobFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("job");
    }

    function setJobInUrl(jobName) {
      const url = new URL(window.location.href);
      if (jobName) {
        url.searchParams.set("job", jobName);
      } else {
        url.searchParams.delete("job");
      }
      window.history.replaceState({}, "", url.toString());
    }

    function formatCurrency(value) {
      if (value === null || value === undefined) return "-";
      return `$${Number(value).toFixed(2)}`;
    }

    function formatRate(value) {
      if (value === null || value === undefined) return "-";
      return `$${Number(value).toFixed(2)}/hr`;
    }

    function formatPercent(value) {
      if (value === null || value === undefined) return "-";
      return `${Number(value).toFixed(1)}%`;
    }

    function formatBytes(value) {
      if (value === null || value === undefined) return "-";
      const bytes = Number(value);
      if (Number.isNaN(bytes)) return "-";
      const units = ["B", "KB", "MB", "GB"];
      let index = 0;
      let size = bytes;
      while (size >= 1024 && index < units.length - 1) {
        size /= 1024;
        index += 1;
      }
      return `${size.toFixed(1)} ${units[index]}`;
    }

    function formatMemoryGiB(mib) {
      if (mib === null || mib === undefined) return "-";
      const value = Number(mib);
      if (Number.isNaN(value)) return "-";
      return `${(value / 1024).toFixed(1)} GiB`;
    }

    function formatResources(job) {
      if (!job) return "-";
      const vcpus = job.vcpus ?? "-";
      const gpus = job.gpus ?? 0;
      const mem = formatMemoryGiB(job.memory_mib);
      return `${vcpus} vCPU | ${mem} | ${gpus} GPU`;
    }

    function formatEta(seconds) {
      if (seconds === null || seconds === undefined) return "-";
      const totalMinutes = Math.max(0, Math.round(seconds / 60));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      if (hours > 0) {
        return `${hours}h${String(minutes).padStart(2, "0")}m`;
      }
      return `${minutes}m`;
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return "-";
      const totalSeconds = Math.max(0, Math.round(seconds));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}h${String(minutes).padStart(2, "0")}m`;
      }
      if (minutes > 0) {
        return `${minutes}m${String(secs).padStart(2, "0")}s`;
      }
      return `${secs}s`;
    }

    function formatTimestamp(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const year = date.getUTCFullYear();
      const month = String(date.getUTCMonth() + 1).padStart(2, "0");
      const day = String(date.getUTCDate()).padStart(2, "0");
      const hours = String(date.getUTCHours()).padStart(2, "0");
      const minutes = String(date.getUTCMinutes()).padStart(2, "0");
      const seconds = String(date.getUTCSeconds()).padStart(2, "0");
      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds} UTC`;
    }

    function formatArgs(args) {
      if (!args) return "";
      const tokens = args.trim().split(/\s+/);
      if (!tokens.length) return "";
      const lines = [];
      let current = "";
      tokens.forEach((token) => {
        if (token.startsWith("-")) {
          if (current) lines.push(current);
          current = token;
        } else if (current) {
          current += ` ${token}`;
        } else {
          current = token;
        }
      });
      if (current) lines.push(current);
      return lines.join("\n");
    }

    function setRefreshing(state) {
      refreshStatus.textContent = state ? "Refreshing..." : "Up to date";
    }

    async function fetchJobs() {
      const response = await fetch("/api/jobs");
      return response.json();
    }

    async function fetchJobDetail(jobName) {
      const response = await fetch(`/api/jobs/${jobName}`);
      if (!response.ok) return null;
      return response.json();
    }

    function renderJobs(jobs) {
      jobsEl.innerHTML = "";
      if (!jobs.length) {
        jobsEl.innerHTML = '<tr><td class="empty">No jobs yet.</td></tr>';
        return;
      }

      const header = document.createElement("thead");
      header.innerHTML = `
        <tr>
          <th>Job</th>
          <th>Status</th>
          <th>ETA</th>
          <th>Cost</th>
        </tr>
      `;
      const body = document.createElement("tbody");

      jobs.forEach((job) => {
        const row = document.createElement("tr");
        if (job.job_name === selectedJob) {
          row.classList.add("active");
        }
        const status = job.status || "-";
        row.innerHTML = `
          <td>${job.job_name}</td>
          <td>${status || "-"}</td>
          <td>${formatEta(job.eta_seconds)}</td>
          <td>${formatCurrency(job.cost_to_date_usd)}</td>
        `;
        row.onclick = () => selectJob(job.job_name);
        body.appendChild(row);
      });

      jobsEl.appendChild(header);
      jobsEl.appendChild(body);
    }

    function renderKeyValueTable(container, items) {
      container.innerHTML = "";
      const table = document.createElement("table");
      const body = document.createElement("tbody");
      items.forEach((item) => {
        const row = document.createElement("tr");
        const label = document.createElement("th");
        label.textContent = item.label;
        const value = document.createElement("td");
        const raw = item.value;
        const text = raw === null || raw === undefined || raw === "" ? "-" : String(raw);
        if (item.html) {
          value.innerHTML = text;
        } else {
          value.textContent = text;
        }
        row.appendChild(label);
        row.appendChild(value);
        body.appendChild(row);
      });
      table.appendChild(body);
      container.appendChild(table);
    }

    function buildStatusLine(detail) {
      if (!detail) return "-";
      const statusLine = detail.status || "-";
      if (detail.status_reason) {
        return `${statusLine} (${detail.status_reason})`;
      }
      return statusLine;
    }

    function renderStatus(job, detail) {
      if (!job || !detail) return;
      const actualInstance = detail.actual_instance_type
        ? `${detail.actual_instance_type}${detail.actual_availability_zone ? ` (${detail.actual_availability_zone})` : ""}`
        : "-";
      const logUrl = detail.log_url || null;
      const items = [
        { label: "Status", value: buildStatusLine(detail) },
        { label: "Instance", value: actualInstance },
        { label: "Requested", value: formatResources(detail) },
        { label: "Spot", value: job.use_spot ? "yes" : "no" },
        { label: "Runtime", value: formatDuration(detail.runtime_seconds) },
        { label: "Progress", value: formatPercent(detail.progress_percent) },
        { label: "ETA", value: formatEta(detail.eta_seconds) },
        {
          label: "Logs",
          value: logUrl ? `<a href="${logUrl}" target="_blank">CloudWatch</a>` : "-",
          html: true,
        },
      ];
      renderKeyValueTable(statusEl, items);
    }

    function renderCost(detail) {
      if (!detail) return;
      const items = [
        { label: "Cost per hour", value: formatRate(detail.hourly_rate_usd) },
        { label: "Cost so far", value: formatCurrency(detail.cost_to_date_usd) },
        { label: "Estimated total", value: formatCurrency(detail.estimated_total_cost_usd) },
        { label: "Budget", value: formatCurrency(detail.budget_usd) },
      ];
      renderKeyValueTable(costEl, items);
    }

    function renderData(detail) {
      dataEl.innerHTML = "";
      if (!detail) return;
      const inputs = detail.inputs || {};
      const entries = Object.entries(inputs);
      if (entries.length) {
        const inputTable = document.createElement("table");
        inputTable.innerHTML = `
          <thead>
            <tr><th>Input</th><th>Path</th></tr>
          </thead>
          <tbody></tbody>
        `;
        const body = inputTable.querySelector("tbody");
        entries.forEach(([name, value]) => {
          const row = document.createElement("tr");
          const link = document.createElement("a");
          const consoleUrl = detail.inputs_console ? detail.inputs_console[name] : null;
          link.href = consoleUrl || value;
          link.textContent = value;
          link.target = "_blank";
          row.innerHTML = `<td>${name}</td><td></td>`;
          row.querySelector("td:last-child").appendChild(link);
          body.appendChild(row);
        });
        dataEl.appendChild(inputTable);
      }

      if (detail.output_s3) {
        const outputBlock = document.createElement("div");
        outputBlock.style.marginTop = entries.length ? "8px" : "0";
        const link = document.createElement("a");
        link.href = detail.output_console_url || detail.output_s3;
        link.textContent = detail.output_s3;
        link.target = "_blank";
        outputBlock.appendChild(document.createTextNode("Output: "));
        outputBlock.appendChild(link);
        dataEl.appendChild(outputBlock);
      }

      if (detail.output_objects && detail.output_objects.length) {
        const table = document.createElement("table");
        table.style.marginTop = "8px";
        table.innerHTML = `
          <thead>
            <tr>
              <th>Output file</th>
              <th>Size</th>
              <th>Modified</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const body = table.querySelector("tbody");
        detail.output_objects.forEach((obj) => {
          const tr = document.createElement("tr");
          const key = obj.key || "";
          tr.innerHTML = `
            <td>${key}</td>
            <td>${formatBytes(obj.size_bytes)}</td>
            <td class="muted">${formatTimestamp(obj.last_modified)}</td>
          `;
          body.appendChild(tr);
        });
        dataEl.appendChild(table);
      }

      if (!entries.length && !detail.output_s3) {
        dataEl.innerHTML = '<div class="empty">No data paths.</div>';
      }
    }

    function renderHistory(detail) {
      historyEl.innerHTML = "";
      if (!detail) return;
      const timeline = detail.timeline || [];
      if (!timeline.length) {
        historyEl.innerHTML = '<div class="empty">No events.</div>';
        return;
      }
      const lines = timeline.map((event) => {
        const stamp = formatTimestamp(event.timestamp);
        const detailText = event.detail ? ` - ${event.detail}` : "";
        return `${stamp} ${event.label}${detailText}`;
      });
      const pre = document.createElement("pre");
      pre.textContent = lines.join("\n");
      historyEl.appendChild(pre);
    }

    function renderArgs(detail) {
      argsEl.textContent = detail ? formatArgs(detail.pism_args) : "";
    }

    function setLoading(jobName) {
      jobTitle.textContent = jobName || "Select a job";
      jobSubtitle.textContent = jobName ? "Loading..." : "Choose a job to see details.";
      statusEl.innerHTML = '<div class="muted">Loading...</div>';
      costEl.innerHTML = '<div class="muted">Loading...</div>';
      dataEl.innerHTML = '<div class="muted">Loading...</div>';
      historyEl.innerHTML = '<div class="muted">Loading...</div>';
      argsEl.textContent = jobName ? "Loading..." : "";
    }

    async function selectJob(jobName) {
      selectedJob = jobName;
      setJobInUrl(jobName);
      setLoading(jobName);
      setRefreshing(true);
      const [jobs, detail] = await Promise.all([fetchJobs(), fetchJobDetail(jobName)]);
      const job = jobs.find((item) => item.job_name === jobName);
      renderJobs(jobs);
      if (job && detail) {
        jobTitle.textContent = job.job_name;
        const statusLine = buildStatusLine(detail);
        const actualNote = detail.actual_instance_type
          ? ` | ${detail.actual_instance_type}${detail.actual_availability_zone ? ` (${detail.actual_availability_zone})` : ""}`
          : "";
        jobSubtitle.textContent = `${statusLine} | ${formatResources(detail)}${actualNote}`;
        renderStatus(job, detail);
        renderCost(detail);
        renderData(detail);
        renderHistory(detail);
        renderArgs(detail);
      }
      setRefreshing(false);
    }

    async function refresh() {
      setRefreshing(true);
      const jobs = await fetchJobs();
      renderJobs(jobs);
      if (selectedJob) {
        const detail = await fetchJobDetail(selectedJob);
        const job = jobs.find((item) => item.job_name === selectedJob);
        if (job && detail) {
          jobTitle.textContent = job.job_name;
          const statusLine = buildStatusLine(detail);
          const actualNote = detail.actual_instance_type
            ? ` | ${detail.actual_instance_type}${detail.actual_availability_zone ? ` (${detail.actual_availability_zone})` : ""}`
            : "";
          jobSubtitle.textContent = `${statusLine} | ${formatResources(detail)}${actualNote}`;
          renderStatus(job, detail);
          renderCost(detail);
          renderData(detail);
          renderHistory(detail);
          renderArgs(detail);
        } else if (!job) {
          selectedJob = null;
          setJobInUrl(null);
        }
      }
      setRefreshing(false);
    }

    const initialJob = getJobFromUrl();
    if (initialJob) {
      selectJob(initialJob);
    } else {
      refresh();
    }
    setInterval(refresh, 15000);
  </script>
</body>
</html>
