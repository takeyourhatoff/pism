<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PISM Cloud Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #0f1b1c;
      --panel: #142426;
      --panel-strong: #1a3033;
      --text: #edf4f5;
      --muted: #9fb2b7;
      --accent: #38b6a5;
      --accent-2: #f0b45b;
      --danger: #f26d5b;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 20%, rgba(56, 182, 165, 0.3), transparent 50%),
        radial-gradient(circle at 80% 0%, rgba(240, 180, 91, 0.2), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }

    header {
      padding: 28px 40px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      padding: 0 40px 40px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .runs {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 400px;
    }

    .run-card {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--panel-strong);
      border: 1px solid transparent;
      cursor: pointer;
      transition: border 0.2s ease, transform 0.2s ease;
    }

    .run-card:hover {
      border-color: rgba(56, 182, 165, 0.5);
      transform: translateY(-2px);
    }

    .run-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 182, 165, 0.3);
    }

    .run-card h3 {
      margin: 0;
      font-size: 15px;
    }

    .run-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .detail {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .section {
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .section-subtitle {
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--muted);
    }

    table.kv {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.kv th,
    table.kv td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: left;
    }

    table.kv th {
      width: 140px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    table.kv td {
      word-break: break-word;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px 16px;
      font-size: 13px;
    }

    .inputs-grid .label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    .inputs-grid .path a {
      color: var(--accent-2);
      text-decoration: none;
      word-break: break-all;
    }

    .inputs-grid .path a:hover {
      text-decoration: underline;
    }

    .outputs-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .outputs-header .prefix {
      word-break: break-word;
    }

    .outputs-header a {
      color: var(--accent-2);
      text-decoration: none;
    }

    .outputs-header a:hover {
      text-decoration: underline;
    }

    .outputs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    .outputs-table th,
    .outputs-table td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .outputs-table th {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    .status-pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    .status-label {
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(56, 182, 165, 0.15);
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
    }

    .status-failed {
      background: rgba(242, 109, 91, 0.15);
      color: var(--danger);
    }

    .muted {
      color: var(--muted);
    }

    a {
      color: var(--accent-2);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .empty {
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }

    pre.args {
      margin: 0;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      border: 1px solid var(--border);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow: auto;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 0 20px 30px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 24px 20px 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PISM Cloud</h1>
      <p>Batch runs summarized for scientists.</p>
    </div>
    <div class="muted" id="refresh-status">Refreshing...</div>
  </header>

  <div class="layout">
    <section class="panel runs" id="runs"></section>

    <section class="panel detail">
      <div>
        <h2 id="run-title">Select a run</h2>
        <p class="muted" id="run-subtitle">Choose a run on the left to see details.</p>
      </div>
      <div class="section-grid">
        <div class="section">
          <h3>Summary</h3>
          <div id="summary"></div>
        </div>
        <div class="section">
          <h3>Cost &amp; progress</h3>
          <div id="costs"></div>
        </div>
      </div>
      <div class="section-grid">
        <div class="section">
          <h3>Config</h3>
          <div id="config"></div>
        </div>
      </div>
      <div class="section">
        <h3>Data paths</h3>
        <div id="inputs"></div>
        <div id="outputs"></div>
      </div>
      <div class="section">
        <h3>PISM Args</h3>
        <pre class="args" id="args"></pre>
      </div>
    </section>
  </div>

  <script>
    const runsEl = document.getElementById("runs");
    const runTitle = document.getElementById("run-title");
    const runSubtitle = document.getElementById("run-subtitle");
    const summaryEl = document.getElementById("summary");
    const costsEl = document.getElementById("costs");
    const configEl = document.getElementById("config");
    const inputsEl = document.getElementById("inputs");
    const outputsEl = document.getElementById("outputs");
    const argsEl = document.getElementById("args");
    const refreshStatus = document.getElementById("refresh-status");

    let selectedRun = null;

    function getRunFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("run");
    }

    function setRunInUrl(runId) {
      const url = new URL(window.location.href);
      if (runId) {
        url.searchParams.set("run", runId);
      } else {
        url.searchParams.delete("run");
      }
      window.history.replaceState({}, "", url.toString());
    }

    function formatCurrency(value) {
      if (value === null || value === undefined) return "-";
      return `$${Number(value).toFixed(2)}`;
    }

    function formatRate(value) {
      if (value === null || value === undefined) return "-";
      return `$${Number(value).toFixed(2)}/hr`;
    }

    function formatPercent(value) {
      if (value === null || value === undefined) return "-";
      return `${Number(value).toFixed(1)}%`;
    }

    function formatBytes(value) {
      if (value === null || value === undefined) return "-";
      const bytes = Number(value);
      if (Number.isNaN(bytes)) return "-";
      const units = ["B", "KB", "MB", "GB"];
      let index = 0;
      let size = bytes;
      while (size >= 1024 && index < units.length - 1) {
        size /= 1024;
        index += 1;
      }
      return `${size.toFixed(1)} ${units[index]}`;
    }

    function formatEta(seconds) {
      if (seconds === null || seconds === undefined) return "-";
      const totalMinutes = Math.max(0, Math.round(seconds / 60));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      if (hours > 0) {
        return `${hours}h${String(minutes).padStart(2, "0")}m`;
      }
      return `${minutes}m`;
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return "-";
      const totalSeconds = Math.max(0, Math.round(seconds));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}h${String(minutes).padStart(2, "0")}m`;
      }
      if (minutes > 0) {
        return `${minutes}m${String(secs).padStart(2, "0")}s`;
      }
      return `${secs}s`;
    }

    function formatArgs(args) {
      if (!args) return "";
      const tokens = args.trim().split(/\s+/);
      if (!tokens.length) return "";
      const lines = [];
      let current = "";
      tokens.forEach((token) => {
        if (token.startsWith("-")) {
          if (current) lines.push(current);
          current = token;
        } else if (current) {
          current += ` ${token}`;
        } else {
          current = token;
        }
      });
      if (current) lines.push(current);
      return lines.join("\n");
    }

    function setRefreshing(state) {
      refreshStatus.textContent = state ? "Refreshing..." : "Up to date";
    }

    async function fetchRuns() {
      const response = await fetch("/api/runs");
      return response.json();
    }

    async function fetchRunDetail(runId) {
      const response = await fetch(`/api/runs/${runId}`);
      if (!response.ok) return null;
      return response.json();
    }

    function renderRuns(runs) {
      runsEl.innerHTML = "";
      if (!runs.length) {
        runsEl.innerHTML = '<div class="empty">No runs yet.</div>';
        return;
      }

      runs.forEach((run) => {
        const card = document.createElement("div");
        card.className = "run-card" + (run.run_id === selectedRun ? " active" : "");
        card.innerHTML = `
          <h3>${run.run_id}</h3>
          <span>${run.instance_type} - ${run.use_spot ? "spot" : "on-demand"}</span>
        `;
        card.onclick = () => selectRun(run.run_id);
        runsEl.appendChild(card);
      });
    }

    function renderKeyValueTable(container, items) {
      container.innerHTML = "";
      const table = document.createElement("table");
      table.className = "kv";
      const body = document.createElement("tbody");
      items.forEach((item) => {
        const row = document.createElement("tr");
        const label = document.createElement("th");
        label.textContent = item.label;
        const value = document.createElement("td");
        const raw = item.value;
        const text = raw === null || raw === undefined || raw === "" ? "-" : String(raw);
        if (item.html) {
          value.innerHTML = text;
        } else {
          value.textContent = text;
        }
        row.appendChild(label);
        row.appendChild(value);
        body.appendChild(row);
      });
      table.appendChild(body);
      container.appendChild(table);
    }

    function renderSummary(run, detail) {
      summaryEl.innerHTML = "";
      costsEl.innerHTML = "";
      if (!run || !detail) return;

      const isRunning = detail.summary && detail.summary.running > 0;
      const summary = detail.summary;
      let statusLine = "-";
      if (summary) {
        if (summary.running > 0) {
          statusLine = "RUNNING";
        } else if (summary.queued > 0) {
          statusLine = "QUEUED";
        } else if (summary.failed > 0) {
          statusLine = "FAILED";
        } else if (summary.succeeded > 0) {
          statusLine = "SUCCEEDED";
        }
      }
      const statusReason =
        detail.jobs && detail.jobs.length && detail.jobs[0].status_reason
          ? detail.jobs[0].status_reason
          : null;
      if (statusReason) {
        statusLine = `${statusLine} (${statusReason})`;
      }
      const actualInstance = detail.actual_instance_type
        ? `${detail.actual_instance_type}${detail.actual_availability_zone ? ` (${detail.actual_availability_zone})` : ""}`
        : "-";

      const summaryItems = [
        { label: "Status", value: statusLine },
        { label: "Queue", value: detail.job_queue || "-" },
        { label: "Requested instance", value: run.instance_type || "-" },
        { label: "Actual instance", value: actualInstance },
        { label: "Spot", value: run.use_spot ? "yes" : "no" },
      ];
      const logUrl = detail.jobs && detail.jobs.length ? detail.jobs[0].log_url : null;
      summaryItems.push({
        label: "Logs",
        value: logUrl ? `<a href="${logUrl}" target="_blank">CloudWatch</a>` : "-",
        html: true,
      });

      const costItems = [
        { label: isRunning ? "Run time (so far)" : "Run time", value: formatDuration(detail.runtime_seconds) },
        { label: "Cost per hour", value: formatRate(detail.hourly_rate_usd) },
        { label: isRunning ? "Cost so far" : "Total cost", value: formatCurrency(detail.cost_to_date_usd) },
        { label: "Estimated total", value: formatCurrency(detail.estimated_total_cost_usd) },
        { label: "Budget", value: formatCurrency(detail.budget_usd) },
        { label: "ETA", value: formatEta(detail.eta_seconds) },
        { label: "Progress", value: formatPercent(detail.progress_percent) },
      ];

      renderKeyValueTable(summaryEl, summaryItems);
      renderKeyValueTable(costsEl, costItems);
    }

    function renderRunDetails(run, detail) {
      configEl.innerHTML = "";
      inputsEl.innerHTML = "";
      outputsEl.innerHTML = "";
      argsEl.textContent = "";
      if (!run || !detail) return;

      const configItems = [
        { label: "Run ID", value: run.run_id },
        { label: "Created", value: detail.created_at || run.created_at || "-" },
        { label: "Job definition", value: detail.job_definition || "-" },
        { label: "Executable", value: detail.pism_executable || "-" },
        { label: "MPI ranks", value: detail.mpi_ranks ?? "-" },
        { label: "GPUs", value: detail.gpus ?? "-" },
        { label: "Instance ID", value: detail.actual_instance_id || "-" },
      ];

      renderKeyValueTable(configEl, configItems);

      const inputs = detail.inputs || {};
      const entries = Object.entries(inputs);
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No inputs listed.";
        inputsEl.appendChild(empty);
      } else {
        const title = document.createElement("div");
        title.className = "section-subtitle";
        title.textContent = "Inputs";
        inputsEl.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "inputs-grid";
        entries.forEach(([name, value]) => {
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = name;
          const val = document.createElement("div");
          val.className = "path";
          const link = document.createElement("a");
          link.href = value;
          link.textContent = value;
          link.target = "_blank";
          val.appendChild(link);
          grid.appendChild(label);
          grid.appendChild(val);
        });
        inputsEl.appendChild(grid);
      }

      if (detail.output_s3) {
        const title = document.createElement("div");
        title.className = "section-subtitle";
        title.textContent = "Outputs";
        outputsEl.appendChild(title);

        const header = document.createElement("div");
        header.className = "outputs-header";
        const prefix = document.createElement("div");
        prefix.className = "prefix";
        const prefixLink = document.createElement("a");
        prefixLink.href = detail.output_s3;
        prefixLink.textContent = detail.output_s3;
        prefixLink.target = "_blank";
        prefix.appendChild(prefixLink);
        header.appendChild(prefix);
        outputsEl.appendChild(header);
        if (detail.output_summary && detail.output_summary.key_count !== undefined) {
          const meta = document.createElement("div");
          meta.className = "section-subtitle";
          meta.textContent = `${detail.output_summary.key_count} object(s)`;
          outputsEl.appendChild(meta);
        }
      }

      const outputSummary = detail.output_summary;
      if (!outputSummary) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Outputs will appear after the job completes.";
        outputsEl.appendChild(empty);
      } else if (outputSummary.status === "pending") {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Outputs available after completion.";
        outputsEl.appendChild(empty);
      } else if (outputSummary.status === "error") {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Unable to fetch outputs.";
        outputsEl.appendChild(empty);
      } else if (!detail.output_objects || detail.output_objects.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No outputs found.";
        outputsEl.appendChild(empty);
      } else {
        const table = document.createElement("table");
        table.className = "outputs-table";
        table.innerHTML = `
          <thead>
            <tr>
              <th>Output file</th>
              <th>Size</th>
              <th>Modified</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const body = table.querySelector("tbody");
        detail.output_objects.forEach((obj) => {
          const tr = document.createElement("tr");
          const key = obj.key || "";
          tr.innerHTML = `
            <td>${key}</td>
            <td>${formatBytes(obj.size_bytes)}</td>
            <td class="muted">${obj.last_modified || "-"}</td>
          `;
          body.appendChild(tr);
        });
        outputsEl.appendChild(table);
        if (outputSummary.truncated) {
          const note = document.createElement("div");
          note.className = "muted";
          note.style.marginTop = "8px";
          note.textContent = "Showing first 50 objects.";
          outputsEl.appendChild(note);
        }
      }

      argsEl.textContent = formatArgs(detail.pism_args);
    }

    async function selectRun(runId) {
      selectedRun = runId;
      setRunInUrl(runId);
      setRefreshing(true);
      const [runs, detail] = await Promise.all([fetchRuns(), fetchRunDetail(runId)]);
      const run = runs.find((item) => item.run_id === runId);
      renderRuns(runs);
      if (run && detail) {
        runTitle.textContent = run.run_id;
        const actualNote = detail.actual_instance_type
          ? ` | actual ${detail.actual_instance_type}${detail.actual_availability_zone ? ` (${detail.actual_availability_zone})` : ""}`
          : "";
        runSubtitle.textContent = `Requested: ${run.instance_type} ${run.use_spot ? "(spot)" : "(on-demand)"}${actualNote}`;
        renderSummary(run, detail);
        renderRunDetails(run, detail);
      }
      setRefreshing(false);
    }

    async function refresh() {
      setRefreshing(true);
      const runs = await fetchRuns();
      renderRuns(runs);
      if (selectedRun) {
        const detail = await fetchRunDetail(selectedRun);
        const run = runs.find((item) => item.run_id === selectedRun);
        if (run && detail) {
          runTitle.textContent = run.run_id;
          const actualNote = detail.actual_instance_type
            ? ` | actual ${detail.actual_instance_type}${detail.actual_availability_zone ? ` (${detail.actual_availability_zone})` : ""}`
            : "";
          runSubtitle.textContent = `Requested: ${run.instance_type} ${run.use_spot ? "(spot)" : "(on-demand)"}${actualNote}`;
          renderSummary(run, detail);
          renderRunDetails(run, detail);
        } else if (!run) {
          selectedRun = null;
          setRunInUrl(null);
        }
      }
      setRefreshing(false);
    }

    const initialRun = getRunFromUrl();
    if (initialRun) {
      selectRun(initialRun);
    } else {
      refresh();
    }
    setInterval(refresh, 15000);
  </script>
</body>
</html>
