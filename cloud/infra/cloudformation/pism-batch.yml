AWSTemplateFormatVersion: "2010-09-09"
Description: "PISM AWS Batch infrastructure (CPU/GPU queues, job definitions, DynamoDB)."

Parameters:
  VpcCidr:
    Type: String
    Description: "CIDR block for the VPC."
    Default: 10.0.0.0/16
  PublicSubnetCidrA:
    Type: String
    Description: "CIDR block for public subnet A."
    Default: 10.0.1.0/24
  PublicSubnetCidrB:
    Type: String
    Description: "CIDR block for public subnet B."
    Default: 10.0.2.0/24
  CpuInstanceTypes:
    Type: CommaDelimitedList
    Description: "CPU instance types for Batch."
    Default: c7i.4xlarge,hpc6a.48xlarge
  GpuInstanceTypes:
    Type: CommaDelimitedList
    Description: "GPU instance types for Batch."
    Default: g5.xlarge
  MaxVcpusCpu:
    Type: Number
    Description: "Max vCPUs for CPU compute environments."
    Default: 512
  MaxVcpusGpu:
    Type: Number
    Description: "Max vCPUs for GPU compute environments."
    Default: 64
  DesiredVcpusCpu:
    Type: Number
    Description: "Desired vCPUs for CPU compute environments."
    Default: 0
  DesiredVcpusGpu:
    Type: Number
    Description: "Desired vCPUs for GPU compute environments."
    Default: 0
  CpuImage:
    Type: String
    Description: "Container image for CPU jobs."
  GpuImage:
    Type: String
    Description: "Container image for GPU jobs."

Resources:
  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/pism
      RetentionInDays: 14

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pism-batch-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: pism-batch-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: pism-batch-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrA
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrB
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-b

  PublicSubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for PISM Batch instances"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  InputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-service-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-spot-fleet-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: spotfleet.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-ecs-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: pism-batch-ecs-instance-profile
      Roles:
        - !Ref EcsInstanceRole

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-job-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pism-batch-job-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub "${InputBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:AbortMultipartUpload
                Resource:
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"

  CpuSpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: pism-cpu-spot
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: 100
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusCpu
        DesiredvCpus: !Ref DesiredVcpusCpu
        InstanceTypes: !Ref CpuInstanceTypes
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn

  CpuOnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: pism-cpu-ondemand
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusCpu
        DesiredvCpus: !Ref DesiredVcpusCpu
        InstanceTypes: !Ref CpuInstanceTypes
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn

  GpuSpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: pism-gpu-spot
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: 100
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusGpu
        DesiredvCpus: !Ref DesiredVcpusGpu
        InstanceTypes: !Ref GpuInstanceTypes
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn

  GpuOnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: pism-gpu-ondemand
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusGpu
        DesiredvCpus: !Ref DesiredVcpusGpu
        InstanceTypes: !Ref GpuInstanceTypes
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn

  CpuSpotQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-cpu-spot
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref CpuSpotComputeEnvironment

  CpuOnDemandQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-cpu-ondemand
      State: ENABLED
      Priority: 80
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref CpuOnDemandComputeEnvironment

  GpuSpotQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-gpu-spot
      State: ENABLED
      Priority: 90
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuSpotComputeEnvironment

  GpuOnDemandQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-gpu-ondemand
      State: ENABLED
      Priority: 85
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuOnDemandComputeEnvironment

  CpuJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: pism-cpu
      Type: container
      ContainerProperties:
        Image: !Ref CpuImage
        Command:
          - bash
          - -lc
          - echo Override command set by pism-cloud
        ResourceRequirements:
          - Type: VCPU
            Value: "1"
          - Type: MEMORY
            Value: "2048"
        JobRoleArn: !GetAtt JobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: pism
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - OnStatusReason: "Host EC2*"
            Action: RETRY

  GpuJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: pism-gpu
      Type: container
      ContainerProperties:
        Image: !Ref GpuImage
        Command:
          - bash
          - -lc
          - echo Override command set by pism-cloud
        ResourceRequirements:
          - Type: VCPU
            Value: "1"
          - Type: MEMORY
            Value: "2048"
          - Type: GPU
            Value: "1"
        JobRoleArn: !GetAtt JobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: pism
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - OnStatusReason: "Host EC2*"
            Action: RETRY

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pism-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE

Outputs:
  BatchJobQueues:
    Description: "Batch job queues (CPU spot, CPU on-demand, GPU spot, GPU on-demand)."
    Value: !Sub "${CpuSpotQueue},${CpuOnDemandQueue},${GpuSpotQueue},${GpuOnDemandQueue}"
  BatchJobDefinitions:
    Description: "Batch job definitions (CPU, GPU)."
    Value: !Sub "${CpuJobDefinition},${GpuJobDefinition}"
  CloudWatchLogGroup:
    Description: "CloudWatch log group for Batch logs."
    Value: !Ref BatchLogGroup
  DynamoTable:
    Description: "DynamoDB table for run metadata."
    Value: !Ref RunsTable
  InputBucketName:
    Description: "S3 bucket for inputs."
    Value: !Ref InputBucket
  OutputBucketName:
    Description: "S3 bucket for outputs."
    Value: !Ref OutputBucket
  VpcId:
    Description: "VPC used for Batch compute."
    Value: !Ref Vpc
  PublicSubnetIds:
    Description: "Public subnets for Batch compute."
    Value: !Sub "${PublicSubnetA},${PublicSubnetB}"
  BatchSecurityGroupId:
    Description: "Security group for Batch compute."
    Value: !Ref BatchSecurityGroup
