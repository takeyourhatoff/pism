AWSTemplateFormatVersion: "2010-09-09"
Description: "PISM AWS Batch infrastructure (CPU/GPU queues, job definitions, DynamoDB)."

Parameters:
  VpcCidr:
    Type: String
    Description: "CIDR block for the VPC."
    Default: 10.0.0.0/16
  PublicSubnetCidrA:
    Type: String
    Description: "CIDR block for public subnet A."
    Default: 10.0.1.0/24
  PublicSubnetCidrB:
    Type: String
    Description: "CIDR block for public subnet B."
    Default: 10.0.2.0/24
  PublicSubnetCidrC:
    Type: String
    Description: "CIDR block for public subnet C."
    Default: 10.0.3.0/24
  PublicSubnetCidrD:
    Type: String
    Description: "CIDR block for public subnet D."
    Default: 10.0.4.0/24
  PublicSubnetCidrE:
    Type: String
    Description: "CIDR block for public subnet E."
    Default: 10.0.5.0/24
  PublicSubnetCidrF:
    Type: String
    Description: "CIDR block for public subnet F."
    Default: 10.0.6.0/24
  CpuInstanceTypes:
    Type: CommaDelimitedList
    Description: "CPU instance types for Batch."
    Default: c7i.4xlarge,c7a.4xlarge,c6i.4xlarge,c6a.4xlarge,m7i.4xlarge,m6i.4xlarge,c5.4xlarge,m5.4xlarge
  GpuInstanceTypes:
    Type: CommaDelimitedList
    Description: "GPU instance types for Batch."
    Default: g5.xlarge
  MaxVcpusCpu:
    Type: Number
    Description: "Max vCPUs for CPU compute environments."
    Default: 512
  MaxVcpusGpu:
    Type: Number
    Description: "Max vCPUs for GPU compute environments."
    Default: 64
  DesiredVcpusCpu:
    Type: Number
    Description: "Desired vCPUs for CPU compute environments."
    Default: 0
  DesiredVcpusGpu:
    Type: Number
    Description: "Desired vCPUs for GPU compute environments."
    Default: 0
  SpotAllocationStrategy:
    Type: String
    Description: "Spot allocation strategy for Batch compute environments."
    Default: SPOT_PRICE_CAPACITY_OPTIMIZED
    AllowedValues:
      - SPOT_PRICE_CAPACITY_OPTIMIZED
      - SPOT_CAPACITY_OPTIMIZED
  CpuImage:
    Type: String
    Description: "Container image for CPU jobs."
  GpuImage:
    Type: String
    Description: "Container image for GPU jobs."

Mappings:
  RegionAzCount:
    af-south-1:
      Count: "3"
    ap-east-1:
      Count: "3"
    ap-northeast-1:
      Count: "4"
    ap-northeast-2:
      Count: "4"
    ap-northeast-3:
      Count: "3"
    ap-south-1:
      Count: "3"
    ap-south-2:
      Count: "3"
    ap-southeast-1:
      Count: "3"
    ap-southeast-2:
      Count: "3"
    ap-southeast-3:
      Count: "3"
    ca-central-1:
      Count: "3"
    ca-west-1:
      Count: "3"
    eu-central-1:
      Count: "3"
    eu-central-2:
      Count: "3"
    eu-north-1:
      Count: "3"
    eu-south-1:
      Count: "2"
    eu-south-2:
      Count: "2"
    eu-west-1:
      Count: "3"
    eu-west-2:
      Count: "3"
    eu-west-3:
      Count: "3"
    il-central-1:
      Count: "3"
    me-central-1:
      Count: "3"
    me-south-1:
      Count: "3"
    sa-east-1:
      Count: "3"
    us-east-1:
      Count: "6"
    us-east-2:
      Count: "3"
    us-west-1:
      Count: "2"
    us-west-2:
      Count: "4"

Conditions:
  HasAzC: !Or
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "3"]
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "4"]
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "5"]
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "6"]
  HasAzD: !Or
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "4"]
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "5"]
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "6"]
  HasAzE: !Or
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "5"]
    - !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "6"]
  HasAzF: !Equals [!FindInMap [RegionAzCount, !Ref AWS::Region, Count], "6"]

Resources:
  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/pism
      RetentionInDays: 14

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pism-batch-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: pism-batch-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: pism-batch-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrA
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrB
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-b

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Condition: HasAzC
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrC
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-c

  PublicSubnetD:
    Type: AWS::EC2::Subnet
    Condition: HasAzD
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrD
      AvailabilityZone: !Select [3, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-d

  PublicSubnetE:
    Type: AWS::EC2::Subnet
    Condition: HasAzE
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrE
      AvailabilityZone: !Select [4, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-e

  PublicSubnetF:
    Type: AWS::EC2::Subnet
    Condition: HasAzF
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidrF
      AvailabilityZone: !Select [5, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pism-batch-public-f

  PublicSubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasAzC
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationD:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasAzD
    Properties:
      SubnetId: !Ref PublicSubnetD
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationE:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasAzE
    Properties:
      SubnetId: !Ref PublicSubnetE
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationF:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasAzF
    Properties:
      SubnetId: !Ref PublicSubnetF
      RouteTableId: !Ref PublicRouteTable

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for PISM Batch instances"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  InputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OutputBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-service-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-spot-fleet-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: spotfleet.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-ecs-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: pism-batch-ecs-instance-profile
      Roles:
        - !Ref EcsInstanceRole

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-job-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pism-batch-job-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !Sub "${InputBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                Resource:
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"

  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pism-batch-orchestrator-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pism-batch-orchestrator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                Resource:
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-cpu"
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-cpu:*"
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-gpu"
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-gpu:*"
                  - !Ref CpuSpotQueue
                  - !Ref CpuOnDemandQueue
                  - !Ref GpuSpotQueue
                  - !Ref GpuOnDemandQueue
              - Effect: Allow
                Action:
                  - batch:TagResource
                Resource:
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-cpu"
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-cpu:*"
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-gpu"
                  - !Sub "arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/pism-gpu:*"
                  - !Ref CpuSpotQueue
                  - !Ref CpuOnDemandQueue
                  - !Ref GpuSpotQueue
                  - !Ref GpuOnDemandQueue
              - Effect: Allow
                Action:
                  - batch:DescribeJobs
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt OutputBucket.Arn

  CpuSpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        AllocationStrategy: !Ref SpotAllocationStrategy
        BidPercentage: 100
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusCpu
        DesiredvCpus: !Ref DesiredVcpusCpu
        InstanceTypes: !Ref CpuInstanceTypes
        Subnets: !If
          - HasAzF
          - - !Ref PublicSubnetA
            - !Ref PublicSubnetB
            - !Ref PublicSubnetC
            - !Ref PublicSubnetD
            - !Ref PublicSubnetE
            - !Ref PublicSubnetF
          - !If
              - HasAzE
              - - !Ref PublicSubnetA
                - !Ref PublicSubnetB
                - !Ref PublicSubnetC
                - !Ref PublicSubnetD
                - !Ref PublicSubnetE
              - !If
                  - HasAzD
                  - - !Ref PublicSubnetA
                    - !Ref PublicSubnetB
                    - !Ref PublicSubnetC
                    - !Ref PublicSubnetD
                  - !If
                      - HasAzC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
                        - !Ref PublicSubnetC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn

  CpuOnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusCpu
        DesiredvCpus: !Ref DesiredVcpusCpu
        InstanceTypes: !Ref CpuInstanceTypes
        Subnets: !If
          - HasAzF
          - - !Ref PublicSubnetA
            - !Ref PublicSubnetB
            - !Ref PublicSubnetC
            - !Ref PublicSubnetD
            - !Ref PublicSubnetE
            - !Ref PublicSubnetF
          - !If
              - HasAzE
              - - !Ref PublicSubnetA
                - !Ref PublicSubnetB
                - !Ref PublicSubnetC
                - !Ref PublicSubnetD
                - !Ref PublicSubnetE
              - !If
                  - HasAzD
                  - - !Ref PublicSubnetA
                    - !Ref PublicSubnetB
                    - !Ref PublicSubnetC
                    - !Ref PublicSubnetD
                  - !If
                      - HasAzC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
                        - !Ref PublicSubnetC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn

  GpuSpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        AllocationStrategy: !Ref SpotAllocationStrategy
        BidPercentage: 100
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusGpu
        DesiredvCpus: !Ref DesiredVcpusGpu
        InstanceTypes: !Ref GpuInstanceTypes
        Subnets: !If
          - HasAzF
          - - !Ref PublicSubnetA
            - !Ref PublicSubnetB
            - !Ref PublicSubnetC
            - !Ref PublicSubnetD
            - !Ref PublicSubnetE
            - !Ref PublicSubnetF
          - !If
              - HasAzE
              - - !Ref PublicSubnetA
                - !Ref PublicSubnetB
                - !Ref PublicSubnetC
                - !Ref PublicSubnetD
                - !Ref PublicSubnetE
              - !If
                  - HasAzD
                  - - !Ref PublicSubnetA
                    - !Ref PublicSubnetB
                    - !Ref PublicSubnetC
                    - !Ref PublicSubnetD
                  - !If
                      - HasAzC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
                        - !Ref PublicSubnetC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn

  GpuOnDemandComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpusGpu
        DesiredvCpus: !Ref DesiredVcpusGpu
        InstanceTypes: !Ref GpuInstanceTypes
        Subnets: !If
          - HasAzF
          - - !Ref PublicSubnetA
            - !Ref PublicSubnetB
            - !Ref PublicSubnetC
            - !Ref PublicSubnetD
            - !Ref PublicSubnetE
            - !Ref PublicSubnetF
          - !If
              - HasAzE
              - - !Ref PublicSubnetA
                - !Ref PublicSubnetB
                - !Ref PublicSubnetC
                - !Ref PublicSubnetD
                - !Ref PublicSubnetE
              - !If
                  - HasAzD
                  - - !Ref PublicSubnetA
                    - !Ref PublicSubnetB
                    - !Ref PublicSubnetC
                    - !Ref PublicSubnetD
                  - !If
                      - HasAzC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
                        - !Ref PublicSubnetC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt EcsInstanceProfile.Arn

  CpuSpotQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-cpu-spot
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref CpuSpotComputeEnvironment

  CpuOnDemandQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-cpu-ondemand
      State: ENABLED
      Priority: 80
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref CpuOnDemandComputeEnvironment

  GpuSpotQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-gpu-spot
      State: ENABLED
      Priority: 90
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuSpotComputeEnvironment

  GpuOnDemandQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: pism-gpu-ondemand
      State: ENABLED
      Priority: 85
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuOnDemandComputeEnvironment

  CpuJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: pism-cpu
      Type: container
      ContainerProperties:
        Image: !Ref CpuImage
        Command:
          - bash
          - -lc
          - echo Override command set by pism-cloud
        ResourceRequirements:
          - Type: VCPU
            Value: "16"
          - Type: MEMORY
            Value: "32768"
        JobRoleArn: !GetAtt JobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: pism
      RetryStrategy:
        Attempts: 1

  GpuJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: pism-gpu
      Type: container
      ContainerProperties:
        Image: !Ref GpuImage
        Command:
          - bash
          - -lc
          - echo Override command set by pism-cloud
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "16384"
          - Type: GPU
            Value: "1"
        JobRoleArn: !GetAtt JobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: pism
      RetryStrategy:
        Attempts: 1

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pism-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_name
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: job_name
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE

  OrchestratorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: pism-batch-orchestrator
      RoleArn: !GetAtt OrchestratorRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "Init",
          "States": {
            "Init": {
              "Type": "Pass",
              "Parameters": {
                "job_name.$": "$.job_name",
                "job_queue.$": "$.job_queue",
                "job_definition.$": "$.job_definition",
                "overrides.$": "$.overrides",
                "tags.$": "$.tags",
                "resume_bucket.$": "$.resume_bucket",
                "resume_key.$": "$.resume_key",
                "attempt": 1
              },
              "Next": "SubmitJob"
            },
            "SubmitJob": {
              "Type": "Task",
              "Resource": "arn:aws:states:::batch:submitJob",
              "Parameters": {
                "JobName.$": "$.job_name",
                "JobQueue.$": "$.job_queue",
                "JobDefinition.$": "$.job_definition",
                "ContainerOverrides.$": "$.overrides",
                "Tags.$": "$.tags"
              },
              "ResultPath": "$.submit",
              "Next": "RecordAttempt"
            },
            "RecordAttempt": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${JobsTable}",
                "Key": {
                  "job_name": { "S.$": "$.job_name" },
                  "sort_key": { "S": "JOB" }
                },
                "UpdateExpression": "SET attempt_job_ids = list_append(if_not_exists(attempt_job_ids, :empty), :new)",
                "ExpressionAttributeValues": {
                  ":empty": { "L": [] },
                  ":new": { "L": [ { "S.$": "$.submit.JobId" } ] }
                }
              },
              "Next": "WaitForCompletion"
            },
            "WaitForCompletion": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "DescribeJob"
            },
            "DescribeJob": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:batch:describeJobs",
              "Parameters": {
                "Jobs.$": "States.Array($.submit.JobId)"
              },
              "ResultSelector": {
                "job.$": "$.jobs[0]"
              },
              "ResultPath": "$.describe",
              "Next": "CheckStatus"
            },
            "CheckStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.describe.job.status",
                  "StringEquals": "SUCCEEDED",
                  "Next": "CheckResumeMarker"
                },
                {
                  "Variable": "$.describe.job.status",
                  "StringEquals": "FAILED",
                  "Next": "CheckSpotFailure"
                }
              ],
              "Default": "WaitForCompletion"
            },
            "CheckSpotFailure": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.describe.job.statusReason",
                  "StringMatches": "Host EC2*",
                  "Next": "IncrementAttempt"
                },
                {
                  "Variable": "$.describe.job.statusReason",
                  "StringMatches": "*instance terminated*",
                  "Next": "IncrementAttempt"
                }
              ],
              "Default": "JobFailed"
            },
            "IncrementAttempt": {
              "Type": "Pass",
              "Parameters": {
                "job_name.$": "$.job_name",
                "job_queue.$": "$.job_queue",
                "job_definition.$": "$.job_definition",
                "overrides.$": "$.overrides",
                "tags.$": "$.tags",
                "resume_bucket.$": "$.resume_bucket",
                "resume_key.$": "$.resume_key",
                "attempt.$": "States.MathAdd($.attempt, 1)"
              },
              "Next": "SubmitJob"
            },
            "CheckResumeMarker": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:s3:listObjectsV2",
              "Parameters": {
                "Bucket.$": "$.resume_bucket",
                "Prefix.$": "$.resume_key",
                "MaxKeys": 1
              },
              "ResultPath": "$.resume_check",
              "Next": "ResumeDecision"
            },
            "ResumeDecision": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.resume_check.KeyCount",
                  "NumericGreaterThan": 0,
                  "Next": "IncrementAttempt"
                }
              ],
              "Default": "JobSucceeded"
            },
            "JobSucceeded": {
              "Type": "Succeed"
            },
            "JobFailed": {
              "Type": "Fail",
              "Cause": "Batch job failed"
            }
          }
        }

Outputs:
  BatchJobQueues:
    Description: "Batch job queues (CPU spot, CPU on-demand, GPU spot, GPU on-demand)."
    Value: !Sub "${CpuSpotQueue},${CpuOnDemandQueue},${GpuSpotQueue},${GpuOnDemandQueue}"
  BatchJobDefinitions:
    Description: "Batch job definitions (CPU, GPU)."
    Value: !Sub "${CpuJobDefinition},${GpuJobDefinition}"
  CloudWatchLogGroup:
    Description: "CloudWatch log group for Batch logs."
    Value: !Ref BatchLogGroup
  DynamoTable:
    Description: "DynamoDB table for job metadata."
    Value: !Ref JobsTable
  StateMachineArn:
    Description: "Step Functions state machine for job orchestration."
    Value: !Ref OrchestratorStateMachine
  InputBucketName:
    Description: "S3 bucket for inputs."
    Value: !Ref InputBucket
  OutputBucketName:
    Description: "S3 bucket for outputs."
    Value: !Ref OutputBucket
  VpcId:
    Description: "VPC used for Batch compute."
    Value: !Ref Vpc
  PublicSubnetIds:
    Description: "Public subnets for Batch compute."
    Value: !Join
      - ","
      - !If
          - HasAzF
          - - !Ref PublicSubnetA
            - !Ref PublicSubnetB
            - !Ref PublicSubnetC
            - !Ref PublicSubnetD
            - !Ref PublicSubnetE
            - !Ref PublicSubnetF
          - !If
              - HasAzE
              - - !Ref PublicSubnetA
                - !Ref PublicSubnetB
                - !Ref PublicSubnetC
                - !Ref PublicSubnetD
                - !Ref PublicSubnetE
              - !If
                  - HasAzD
                  - - !Ref PublicSubnetA
                    - !Ref PublicSubnetB
                    - !Ref PublicSubnetC
                    - !Ref PublicSubnetD
                  - !If
                      - HasAzC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
                        - !Ref PublicSubnetC
                      - - !Ref PublicSubnetA
                        - !Ref PublicSubnetB
  BatchSecurityGroupId:
    Description: "Security group for Batch compute."
    Value: !Ref BatchSecurityGroup
